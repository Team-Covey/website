<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Board - WorldFlight Team Covey</title>
  <meta name="description" content="Live WorldFlight sector schedule shown as an airport departures board: departure and arrival windows, block times, flow control and filed ATC routes." />
  <link rel="icon" type="image/png" href="/images/CoveyBlackLogo.png" />
  <link rel="apple-touch-icon" href="/images/CoveyBlackLogo.png" />
  <script>(function(){var t=localStorage.getItem('tcwf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>

  <header id="site-header"></header>

  <main>

    <section class="wf-board-section">
      <div class="container">

        <div id="wf-board-root" class="wf-board-root is-loading">

          <h1 class="wf-visually-hidden">WorldFlight schedule board</h1>

          <div class="wf-board-shell">

            <div class="wf-board-banner">
              <span class="wf-board-banner-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
              </span>
              <h2>Departures</h2>
              <div class="wf-board-banner-meta">
                <div class="wf-board-clock">
                  <small>UTC</small>
                  <strong id="wf-board-clock-utc">--:--:--</strong>
                </div>
                <div class="wf-board-clock">
                  <small id="wf-board-zone">Local</small>
                  <strong id="wf-board-clock-local">--:--:--</strong>
                </div>
              </div>
            </div>

            <div class="wf-board-head">
              <div class="wf-board-head-lead">
                <span class="wf-board-live" aria-hidden="true"></span>
                <p class="wf-board-title"><span id="wf-board-event">WorldFlight</span> &middot; live sector schedule</p>
              </div>
              <p class="wf-board-updated" id="wf-board-updated"></p>
            </div>

            <div class="wf-board-toolbar">
              <div class="wf-board-days" id="wf-board-days" role="group" aria-label="Filter by day"></div>
              <div class="wf-board-tools">
                <label class="wf-visually-hidden" for="wf-board-search">Search sectors</label>
                <input type="search" id="wf-board-search" class="wf-board-search"
                  placeholder="Search sector, ICAO or city" autocomplete="off" />
                <div class="wf-board-timebase" role="group" aria-label="Time base">
                  <button type="button" data-timebase="utc" class="is-active" aria-pressed="true">UTC</button>
                  <button type="button" data-timebase="local" aria-pressed="false">Local</button>
                </div>
              </div>
            </div>

            <div class="wf-board-columns" aria-hidden="true">
              <span class="wf-col-time">Time</span>
              <span class="wf-col-dest">Destination</span>
              <span class="wf-col-flight">Flight</span>
              <span class="wf-col-remark">Remarks</span>
              <span class="wf-col-block wf-col-right">Block</span>
              <span class="wf-col-chev"></span>
            </div>

            <div class="wf-board-body" id="wf-board-body">
              <div class="wf-board-skeleton" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>

            <div class="wf-board-foot">
              <p class="wf-board-count" id="wf-board-count">&mdash;</p>
              <p class="wf-board-source">Source:
                <a href="https://planning.worldflight.center/" target="_blank" rel="noopener noreferrer">planning.worldflight.center</a>
                &middot; refreshes automatically
              </p>
            </div>
          </div>

          <p class="wf-board-error" id="wf-board-error" role="alert" hidden></p>

        </div>

      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <script src="/assets/js/worldflight-data.js"></script>
  <script src="/assets/js/worldflight-schedule.js"></script>
  <script src="/assets/js/header.js"></script>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/footer.js"></script>

</body>
</html>
